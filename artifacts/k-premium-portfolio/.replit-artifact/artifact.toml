kind = "web"
previewPath = "/"
title = "K Premium Portfolio"
description = "A personal portfolio for K featuring Discord work, creative experiments, social links, and a music shelf."
version = "1.0.0"
id = "artifacts/k-premium-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20054

[services.development]
run = "pnpm --filter @workspace/k-premium-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/k-premium-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/k-premium-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20054"
BASE_PATH = "/"
